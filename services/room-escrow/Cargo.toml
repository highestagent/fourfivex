[package]
name = "fourfivex-room-escrow"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
overflow-checks = true
